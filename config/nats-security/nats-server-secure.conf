# NATS Server Secure Configuration
# Production-ready configuration with TLS and authentication

# Server identification
server_name: "all-purpose-nats"

# Network configuration
port: 4222
http_port: 8222

# TLS Configuration
tls {
  cert_file: "/etc/nats/certs/server.crt"
  key_file: "/etc/nats/certs/server.key"
  ca_file: "/etc/nats/certs/ca.crt"
  verify: true                    # Enable mutual TLS
  min_version: "1.2"             # Minimum TLS version
  cipher_suites: [
    "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
    "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
    "TLS_RSA_WITH_AES_256_GCM_SHA384"
  ]
  timeout: 2.0                   # TLS handshake timeout in seconds
}

# Authentication and Authorization
authorization {
  # Define users with specific permissions
  users = [
    {
      user: "factory-core"
      password: "$FACTORY_CORE_PASSWORD"
      permissions: {
        publish: [
          "factory.>",
          "meta-agent.>",
          "workflow.>",
          "agent.*.heartbeat"
        ]
        subscribe: [
          ">",  # Factory core can subscribe to everything
        ]
      }
    },
    {
      user: "backend-agent"
      password: "$BACKEND_AGENT_PASSWORD"
      permissions: {
        publish: [
          "agent.backend.>",
          "task.completed",
          "task.failed",
          "progress.>"
        ]
        subscribe: [
          "agent.backend.task",
          "agent.type.backend.task",
          "workflow.>",
          "broadcast.>"
        ]
      }
    },
    {
      user: "frontend-agent"
      password: "$FRONTEND_AGENT_PASSWORD"
      permissions: {
        publish: [
          "agent.frontend.>",
          "task.completed",
          "task.failed",
          "progress.>"
        ]
        subscribe: [
          "agent.frontend.task",
          "agent.type.frontend.task",
          "workflow.>",
          "broadcast.>"
        ]
      }
    },
    {
      user: "devops-agent"
      password: "$DEVOPS_AGENT_PASSWORD"
      permissions: {
        publish: [
          "agent.devops.>",
          "task.completed",
          "task.failed",
          "progress.>"
        ]
        subscribe: [
          "agent.devops.task",
          "agent.type.devops.task",
          "workflow.>",
          "broadcast.>"
        ]
      }
    },
    {
      user: "qa-agent"
      password: "$QA_AGENT_PASSWORD"
      permissions: {
        publish: [
          "agent.qa.>",
          "task.completed",
          "task.failed",
          "progress.>"
        ]
        subscribe: [
          "agent.qa.task",
          "agent.type.qa.task",
          "workflow.>",
          "broadcast.>"
        ]
      }
    },
    {
      user: "documentation-agent"
      password: "$DOCUMENTATION_AGENT_PASSWORD"
      permissions: {
        publish: [
          "agent.documentation.>",
          "task.completed",
          "task.failed",
          "progress.>"
        ]
        subscribe: [
          "agent.documentation.task",
          "agent.type.documentation.task",
          "workflow.>",
          "broadcast.>"
        ]
      }
    },
    {
      user: "monitoring"
      password: "$MONITORING_PASSWORD"
      permissions: {
        publish: []  # Read-only user
        subscribe: [
          ">",  # Can subscribe to everything for monitoring
        ]
      }
    }
  ]
}

# JetStream Configuration
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: "1GB"
  max_file_store: "10GB"
}

# Clustering (for future scaling)
# cluster {
#   name: "all-purpose-cluster"
#   listen: "0.0.0.0:6222"
#   routes: [
#     "nats://nats-2:6222"
#     "nats://nats-3:6222"
#   ]
# }

# Logging
debug: false
trace: false
logtime: true
log_file: "/var/log/nats/nats.log"

# Monitoring
http {
  port: 8222
  # Enable HTTPS for monitoring endpoint
  # tls {
  #   cert_file: "/etc/nats/certs/server.crt"
  #   key_file: "/etc/nats/certs/server.key"
  # }
}

# Limits
max_connections: 10000
max_control_line: 4KB
max_payload: 8MB
max_pending_size: 32MB
max_subscriptions: 0  # Unlimited

# Timeouts
ping_interval: 2m
ping_max: 3
write_deadline: "10s"

# System Account (for internal NATS operations)
system_account: "SYS"