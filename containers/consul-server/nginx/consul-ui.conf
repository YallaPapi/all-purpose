# Nginx Configuration for Consul UI Proxy
# Provides secure access to Consul UI in production environments

upstream consul_backend {
    server consul-prod-server-1:8500;
    server consul-prod-server-2:8500 backup;
    server consul-prod-server-3:8500 backup;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=consul_ui:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=consul_api:10m rate=60r/m;

server {
    listen 80;
    server_name consul-ui.all-purpose.local;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;
    
    # Consul UI
    location /ui/ {
        limit_req zone=consul_ui burst=5 nodelay;
        
        proxy_pass http://consul_backend/ui/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Consul UI specific headers
        proxy_set_header X-Consul-Token $http_x_consul_token;
        
        # Timeout configuration
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Consul API (limited access)
    location /v1/ {
        limit_req zone=consul_api burst=10 nodelay;
        
        # Only allow specific safe API endpoints
        location ~ ^/v1/(status|health|catalog|agent/self)/ {
            proxy_pass http://consul_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pass through Consul token
            proxy_set_header X-Consul-Token $http_x_consul_token;
            
            # Timeout configuration
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
        
        # Block dangerous API endpoints
        location ~ ^/v1/(acl|operator|snapshot)/ {
            return 403 "Access denied to administrative endpoints";
        }
        
        # Default deny for unmatched API paths
        return 404 "API endpoint not available through proxy";
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect root to UI
    location = / {
        return 301 /ui/;
    }
    
    # Block access to sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Logging
    access_log /var/log/nginx/consul-ui-access.log combined;
    error_log /var/log/nginx/consul-ui-error.log warn;
    
    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # Security: Hide nginx version
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        application/atom+xml
        image/svg+xml;
}