# Redis Production Replica Configuration
# Task 191.2: Redis Service Registry Production Replica Setup

# Network and Basic Configuration
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile /data/redis-replica.log
databases 16

# Persistence Configuration (Replica - Less Aggressive)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Configuration (Disabled on replicas to reduce I/O)
appendonly no

# Replication Configuration (Replica)
replicaof ${REDIS_MASTER_HOST} ${REDIS_MASTER_PORT}
masterauth ${REDIS_MASTER_PASSWORD}
replica-serve-stale-data yes
replica-read-only yes
replica-diskless-sync no
replica-diskless-sync-delay 5
replica-priority 100

# Security Configuration (Production)
requirepass ${REDIS_PASSWORD}
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command EVAL ""
rename-command DEBUG ""
rename-command SHUTDOWN SHUTDOWN_SECRET_KEY

# Memory Management (Replica)
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing (Recommended)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Threading Configuration
io-threads 4
io-threads-do-reads yes

# Client Output Buffer Limits (Replica)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client Connection Configuration
maxclients 50000
timeout 300

# Slow Log Configuration (Production)
slowlog-log-slower-than 1000  # 1ms threshold
slowlog-max-len 1000

# Latency Monitoring (Production)
latency-monitor-threshold 50  # 50 microseconds threshold

# Advanced Configuration
tcp-keepalive 60
tcp-user-timeout 30000

# Data Structure Configuration (Same as master)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Kernel OOM Control
oom-score-adj no

# UEP Registry Replica Optimizations
# Enable keyspace notifications (replicas can handle read queries with events)
notify-keyspace-events AKE

# Performance tuning for read-heavy workload
hz 50  # Lower frequency on replicas (they don't handle writes)

# Memory optimization for registry patterns
hash-max-ziplist-entries 1024
hash-max-ziplist-value 1024
set-max-intset-entries 1024

# Networking optimizations
tcp-backlog 2048

# Logging for production monitoring
syslog-enabled yes
syslog-ident redis-registry-replica
syslog-facility local0

# Replica-specific optimizations
replica-ignore-maxmemory yes  # Don't evict keys on replica
replica-lazy-flush yes        # Non-blocking FLUSHALL for replicas

# Additional Security
protected-mode yes
bind-source-addr ""

# Performance Monitoring
tracking-table-max-keys 1000000

# Replica announcement (for Sentinel)
replica-announce-ip auto
replica-announce-port 6379