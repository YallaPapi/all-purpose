# Redis Sentinel Configuration
# Task 191.2: Redis Service Registry High Availability with Sentinel

# Sentinel Configuration
port 26379
bind 0.0.0.0
protected-mode yes

# Sentinel Auth
requirepass ${REDIS_PASSWORD}

# Monitor Master
sentinel monitor uep-registry ${REDIS_MASTER_HOST} ${REDIS_MASTER_PORT} 2
sentinel auth-pass uep-registry ${REDIS_PASSWORD}

# Timing Configuration
sentinel down-after-milliseconds uep-registry 5000
sentinel parallel-syncs uep-registry 1
sentinel failover-timeout uep-registry 60000

# Sentinel Deny Scripts Reconfig
sentinel deny-scripts-reconfig yes

# Logging
logfile /data/sentinel.log
loglevel notice

# Sentinel Scripts (Notifications)
# sentinel notification-script uep-registry /scripts/notify.sh
# sentinel client-reconfig-script uep-registry /scripts/reconfig.sh

# Advanced Sentinel Configuration

# Resolve hostnames to IPs for better reliability
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Master failure detection
sentinel master-reboot-down-after-period uep-registry 0

# Configuration Management
sentinel config-epoch uep-registry 0

# Memory and Performance
# Sentinel is lightweight, these settings are conservative
hz 10
tcp-backlog 511

# Security
protected-mode yes

# Client connections
maxclients 4064

# UEP Registry Specific Sentinel Configuration
# These settings are optimized for the UEP agent registry workload

# Quick failover for service discovery availability
sentinel down-after-milliseconds uep-registry 3000

# Conservative parallel sync to avoid overwhelming replicas during failover
sentinel parallel-syncs uep-registry 1

# Longer failover timeout to ensure clean promotion
sentinel failover-timeout uep-registry 180000

# Enable notification scripts for UEP integration
# sentinel notification-script uep-registry /opt/sentinel/scripts/uep-notify.sh

# Custom commands for UEP registry management
# These would be implemented as external scripts
# sentinel notification-script uep-registry /opt/sentinel/scripts/uep-registry-failover.sh
# sentinel client-reconfig-script uep-registry /opt/sentinel/scripts/uep-registry-reconfig.sh

# Announce settings for container environments
sentinel announce-ip auto
sentinel announce-port 26379