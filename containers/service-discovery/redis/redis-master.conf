# Redis Production Master Configuration
# Task 191.2: Redis Service Registry Production Master Setup

# Network and Basic Configuration
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile /data/redis-master.log
databases 16

# Persistence Configuration (Production - Aggressive)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Configuration (Production)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Replication Configuration (Master)
# Automatically configured by environment variables
# replica-serve-stale-data yes
# replica-read-only yes
# replica-diskless-sync no
# replica-diskless-sync-delay 5

# Security Configuration (Production)
requirepass ${REDIS_PASSWORD}
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command EVAL ""
rename-command DEBUG ""
rename-command SHUTDOWN SHUTDOWN_SECRET_KEY

# Memory Management (Production)
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing (Recommended)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Threading Configuration
io-threads 4
io-threads-do-reads yes

# Client Output Buffer Limits (Production)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client Connection Configuration
maxclients 50000
timeout 300

# Slow Log Configuration (Production)
slowlog-log-slower-than 1000  # 1ms threshold
slowlog-max-len 1000

# Latency Monitoring (Production)
latency-monitor-threshold 50  # 50 microseconds threshold

# Advanced Configuration
tcp-keepalive 60
tcp-user-timeout 30000

# Hash Configuration (Optimized for registry data)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List Configuration
list-max-ziplist-size -2
list-compress-depth 0

# Set Configuration (Optimized for agent indexing)
set-max-intset-entries 512

# Sorted Set Configuration
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Stream Configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Kernel OOM Control
oom-score-adj no

# UEP Registry Production Optimizations
# Enable keyspace notifications for real-time registry events
notify-keyspace-events AKE

# Optimize for service registry workload patterns
# - Many small hash objects (agent metadata)
# - Frequent set operations (indexing)
# - Time-based expiration (heartbeats)

# Performance tuning
hz 100  # Higher frequency for better expiration handling

# Memory optimization for registry patterns
hash-max-ziplist-entries 1024
hash-max-ziplist-value 1024
set-max-intset-entries 1024

# Networking optimizations
tcp-backlog 2048

# Logging for production monitoring
syslog-enabled yes
syslog-ident redis-registry-master
syslog-facility local0

# Additional Security
protected-mode yes
bind-source-addr ""

# Performance Monitoring
# Enable memory usage tracking
tracking-table-max-keys 1000000