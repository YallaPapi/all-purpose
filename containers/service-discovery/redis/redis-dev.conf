# Redis Development Configuration
# Task 191.2: Redis Service Registry Development Setup

# Network and Basic Configuration
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Configuration
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# Persistence Configuration (Development - Less Aggressive)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Replication (Development - Single Node)
# replica-serve-stale-data yes
# replica-read-only yes

# Security (Development - Permissive)
# requirepass foobared

# Memory Management (Development)
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy Freeing (Recommended)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Threading (For Redis 6.0+)
# io-threads 4
# io-threads-do-reads yes

# Kernel OOM Control
oom-score-adj no

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client Connection Configuration
maxclients 10000
timeout 0

# Slow Log Configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 100

# Hash Configuration
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List Configuration
list-max-ziplist-size -2
list-compress-depth 0

# Set Configuration
set-max-intset-entries 512

# Sorted Set Configuration
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Stream Configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# TLS Configuration (Disabled for Development)
# port 0
# tls-port 6379
# tls-cert-file redis.crt
# tls-key-file redis.key

# UEP Registry Specific Settings
# Custom configuration for UEP agent registry
# These settings optimize for service discovery workloads

# Optimize for many small keys (agent metadata)
hash-max-ziplist-entries 1024
hash-max-ziplist-value 1024

# Enable keyspace notifications for registry events
notify-keyspace-events Ex

# Optimize for set operations (agent indexing)
set-max-intset-entries 1024

# Performance tuning for registry workload
hz 50  # Increase background task frequency