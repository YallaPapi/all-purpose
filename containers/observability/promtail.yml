server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Factory Core logs
  - job_name: factory-core
    static_configs:
      - targets:
          - localhost
        labels:
          job: factory-core
          service: meta-agent-factory
          component: factory-core
          __path__: /var/log/factory-core/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            requestId: requestId
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
          requestId:
      - output:
          source: message

  # Domain Agents logs
  - job_name: domain-agents
    static_configs:
      - targets:
          - localhost
        labels:
          job: domain-agents
          service: meta-agent-factory
          component: domain-agents
          __path__: /var/log/domain-agents/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            service: service
            domain: domain
            requestId: requestId
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          service:
          domain:
          requestId:
      - output:
          source: message

  # API Gateway logs
  - job_name: api-gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: api-gateway
          service: meta-agent-factory
          component: api-gateway
          __path__: /var/log/traefik/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            clientIP: clientIP
            method: method
            path: path
            status: status
            duration: duration
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          method:
          status:
      - output:
          source: message

  # NATS Broker logs
  - job_name: nats-broker
    static_configs:
      - targets:
          - localhost
        labels:
          job: nats-broker
          service: meta-agent-factory
          component: nats-broker
          __path__: /var/log/nats/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            client: client
            subject: subject
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          client:
          subject:
      - output:
          source: message

  # UEP Service logs
  - job_name: uep-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: uep-service
          service: meta-agent-factory
          component: uep-service
          __path__: /var/log/uep-service/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            protocol: protocol
            validation: validation
            requestId: requestId
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          protocol:
          validation:
          requestId:
      - output:
          source: message

  # Service Discovery logs
  - job_name: service-discovery
    static_configs:
      - targets:
          - localhost
        labels:
          job: service-discovery
          service: meta-agent-factory
          component: service-discovery
          __path__: /var/log/service-discovery/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            operation: operation
            serviceName: serviceName
            serviceType: serviceType
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          operation:
          serviceName:
          serviceType:
      - output:
          source: message

  # Docker container logs (fallback)
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)' 
        target_label: 'container_name'
        replacement: '${1}'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_logging_jobname']
        target_label: 'job'
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output