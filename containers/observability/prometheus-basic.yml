global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'factory-core'
    static_configs:
      - targets: ['factory-core:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'domain-agents'
    static_configs:
      - targets: ['domain-agents:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s