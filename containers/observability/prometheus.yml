global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'factory-core'
    static_configs:
      - targets: ['factory-core:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'domain-agents'
    static_configs:
      - targets: ['domain-agents:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'nats-broker'
    static_configs:
      - targets: ['nats-broker:8222']
    metrics_path: '/varz'
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093