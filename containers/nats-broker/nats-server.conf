# NATS Server Configuration for UEP Event Bus - Meta-Agent Factory
server_name: uep-event-bus-primary
port: 4222
http_port: 8222
monitor_port: 8222

# JetStream Configuration - Enhanced for UEP Protocol
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 2GB
  max_file_store: 50GB
  
  # Domain for UEP multi-tenancy
  domain: "uep-meta-agent-factory"
  
  # Enable JetStream API with UEP extensions
  # This allows stream and consumer management via NATS API
  # UEP validation service will use this for message interception
  
  # Performance tuning for UEP high-throughput scenarios
  max_outstanding_catchup: 8388608  # 8MB for fast catch-up
  unique_tag: "uep-node-1"
}

# Enhanced Authentication for UEP Protocol Agents
authorization {
  # UEP Protocol users with version-specific permissions
  users = [
    {
      user: "uep-factory-core"
      password: "uep-factory-secret-2024"
      permissions = {
        publish = ["UEP.>", "factory.>", "metrics.>"]
        subscribe = ["UEP.>", "factory.>", "meta.agent.>", "domain.>"]
      }
    }
    {
      user: "uep-meta-agents"
      password: "uep-agents-secret-2024"
      permissions = {
        publish = ["UEP.v*.meta.>", "meta.agent.>"]
        subscribe = ["UEP.v*.meta.>", "factory.task.>"]
      }
    }
    {
      user: "uep-domain-agents"
      password: "uep-domain-secret-2024"
      permissions = {
        publish = ["UEP.v*.domain.>", "domain.>"]
        subscribe = ["UEP.v*.domain.>", "factory.coordination.>"]
      }
    }
    {
      user: "uep-validation-service"
      password: "uep-validation-secret-2024"
      permissions = {
        publish = ["UEP.>", "validation.>", "audit.>"]
        subscribe = ["UEP.>", "_INBOX.>"]
      }
    }
    {
      user: "uep-monitoring"
      password: "uep-monitoring-secret-2024"
      permissions = {
        publish = ["metrics.>", "alerts.>"]
        subscribe = ["UEP.>", "metrics.>", "audit.>", "$JS.>"]
      }
    }
  ]
}

# Enhanced Clustering for UEP High Availability
cluster {
  name: uep-event-bus-cluster
  listen: 0.0.0.0:6222
  
  # UEP-specific cluster routes for cross-node communication
  routes = [
    nats://uep-event-bus-secondary:6222
    nats://uep-event-bus-tertiary:6222
  ]
  
  authorization {
    user: uep-cluster
    password: uep-cluster-secret-2024
    timeout: 2.0
  }
  
  # UEP protocol requires fast cluster sync
  no_advertise: false
  connect_retries: 5
  advertise: $CLUSTER_ADVERTISE
}

# Enhanced Logging for UEP Protocol Debugging
log_file: "/logs/uep-nats-server.log"
logtime: true
debug: false
trace: false
trace_verbose: false

# UEP Protocol requires higher connection and message limits
max_connections: 5000
max_control_line: 8KB
max_payload: 128MB
max_pending: 256MB
max_subscriptions: 10000

# Write deadline for UEP protocol validation latency requirements
write_deadline: "3s"

# Enable NATS Ping interval for UEP agent health monitoring
ping_interval: "30s"
ping_max: 3

# UEP-specific system account for cross-cutting concerns
system_account: "SYS"
accounts: {
  SYS: {
    users: [
      {user: "sys", password: "sys-secret-2024"}
    ]
  }
  UEP: {
    users: [
      {user: "uep-system", password: "uep-system-secret-2024"}
    ]
    jetstream: enabled
    exports: [
      {service: "uep.validation", response: stream}
      {stream: "UEP.>"}
      {stream: "audit.>"}
    ]
  }
}

# TLS Configuration for Production UEP Deployment
tls {
  cert_file: "/certs/uep-server.crt"
  key_file: "/certs/uep-server.key"
  ca_file: "/certs/uep-ca.crt"
  verify: true
  verify_and_map: true
  timeout: 3
  
  # UEP protocol certificate mapping for agent identity
  map = {
    "CN=uep-meta-agent-factory": "uep-factory-core"
    "CN=uep-meta-agent": "uep-meta-agents"
    "CN=uep-domain-agent": "uep-domain-agents"
    "CN=uep-validation-service": "uep-validation-service"
  }
}

# UEP Protocol Monitoring and Metrics
monitoring {
  http_port: 8222
  https_port: 8443
  
  # Enhanced monitoring for UEP protocol validation
  # Expose JetStream metrics for Prometheus scraping
}

# UEP-specific Resolver for Subject Hierarchies
resolver {
  type: "memory"
  dir: "/data/resolver"
  
  # UEP subject resolution map
  # UEP.{version}.{agent-type}.{capability}.{action}
}