# NATS Server Configuration for Meta-Agent Factory MVS
server_name: meta-agent-factory-nats
port: 4222
http_port: 8222
monitor_port: 8222

# JetStream Configuration
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1GB
  max_file_store: 10GB
  
  # Domain for multi-tenancy
  domain: "meta-agent-factory"
  
  # Enable JetStream API
  # This allows stream and consumer management via NATS API
}

# Authentication (development)
authorization {
  users = [
    {user: "factory", password: "factory-secret"}
    {user: "agents", password: "agents-secret"}
  ]
}

# Clustering (for future scaling)
cluster {
  name: meta-agent-cluster
  listen: 0.0.0.0:6222
  authorization {
    user: cluster
    password: cluster-secret
    timeout: 0.5
  }
}

# Logging
log_file: "/logs/nats-server.log"
logtime: true
debug: false
trace: false

# Limits
max_connections: 1000
max_control_line: 4KB
max_payload: 64MB
max_pending: 64MB

