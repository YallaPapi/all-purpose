worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream factory_core {
        server meta-agent-factory-core:3000;
    }
    
    upstream domain_agents {
        server meta-agent-domain-agents:3001;
    }
    
    upstream uep_service {
        server meta-agent-uep-service:3002;
    }
    
    server {
        listen 8080;
        
        location /health {
            return 200 '{"status": "healthy", "service": "api-gateway"}';
            add_header Content-Type application/json;
        }
        
        location /api/factory/ {
            proxy_pass http://factory_core/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/agents/ {
            proxy_pass http://domain_agents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /api/uep/ {
            proxy_pass http://uep_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        location /metrics {
            stub_status on;
            access_log off;
        }
    }
}