version: '3.8'

services:
  nats-test:
    image: nats:latest
    container_name: nats-test-server
    ports:
      - "4222:4222"
      - "8222:8222"
    command: [
      "--auth", "factory:factory-secret",
      "--http_port", "8222",
      "--port", "4222",
      "--js",
      "--log"
    ]
    volumes:
      - nats-test-data:/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  test-network:
    driver: bridge

volumes:
  nats-test-data:
    driver: local