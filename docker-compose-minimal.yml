version: '3.8'

services:
  # Core Infrastructure (already running)
  redis:
    image: redis:7-alpine
    container_name: meta-agent-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - meta-agent-factory

  nats-broker:
    image: nats:2.10-alpine
    container_name: meta-agent-nats-broker
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - meta-agent-factory

  etcd:
    image: quay.io/coreos/etcd:v3.5.7
    container_name: meta-agent-etcd
    ports:
      - "2379:2379"
    environment:
      - ETCD_NAME=meta-agent-etcd
      - ETCD_DATA_DIR=/etcd-data
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - meta-agent-factory

  # Factory Core (running with volume mount)
  factory-core:
    image: meta-agent-factory-core:fixed
    container_name: meta-agent-factory-core
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats-broker:4222
    volumes:
      - ${PWD}/src/meta-agents:/app/src/meta-agents
      - ./logs/factory-core:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - redis
      - nats-broker
      - etcd
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: meta-agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./containers/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - meta-agent-factory
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: meta-agent-grafana
    ports:
      - "3004:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./containers/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./containers/observability/dashboards:/var/lib/grafana/dashboards
    networks:
      - meta-agent-factory
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:latest
    container_name: meta-agent-loki
    ports:
      - "3100:3100"
    volumes:
      - ./containers/observability/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - meta-agent-factory
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  meta-agent-factory:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data: