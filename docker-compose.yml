version: '3.8'

# All-Purpose Meta-Agent Factory - Production Docker Compose Configuration
# Complete orchestration with proper service dependencies, health checks, and monitoring
# Usage: docker-compose up -d
# Dashboard: http://localhost:3000/admin/observability

services:
  # API Gateway - Traefik
  # API Gateway - Traefik
  api-gateway:
    build:
      context: ./containers/api-gateway
      dockerfile: Dockerfile
    container_name: meta-agent-factory-gateway
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/data
      - ./containers/api-gateway/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - meta-agent-factory
    depends_on:
      factory-core:
        condition: service_healthy
      domain-agents:
        condition: service_healthy
      uep-service:
        condition: service_healthy
      uep-registry:
        condition: service_healthy
      observability:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # Factory Core - 11 Meta-Agents
  factory-core:
    build:
      context: .
      dockerfile: ./containers/factory-core/Dockerfile
    container_name: meta-agent-factory-core
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-factory-core-secret}
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats-broker:4222
      - UEP_REGISTRY_URL=http://uep-registry:3001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=factory-core
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=service.name=factory-core,service.version=1.0.0,deployment.environment=production
    volumes:
      - ./data/factory-core:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      redis:
        condition: service_healthy
      nats-broker:
        condition: service_healthy
      uep-registry:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.factory.rule=Host(`factory.localhost`)"
      - "traefik.http.services.factory.loadbalancer.server.port=3000"

  # Domain Agents - 5 Specialists
  domain-agents:
    build:
      context: .
      dockerfile: ./containers/domain-agents/Dockerfile
    container_name: meta-agent-domain-agents
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NATS_URL=nats://nats-broker:4222
      - FACTORY_CORE_URL=http://factory-core:3000
      - UEP_REGISTRY_URL=http://uep-registry:3001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=domain-agents
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_RESOURCE_ATTRIBUTES=service.name=domain-agents,service.version=1.0.0,deployment.environment=production
    volumes:
      - ./data/domain-agents:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      nats-broker:
        condition: service_healthy
      factory-core:
        condition: service_healthy
      uep-registry:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '0.8'
        reservations:
          memory: 256M
          cpus: '0.2'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agents.rule=Host(`agents.localhost`)"
      - "traefik.http.services.agents.loadbalancer.server.port=3001"

  # UEP Registry Service - Service Discovery and Agent Registration
  uep-registry:
    build:
      context: ./services/uep-registry
      dockerfile: Dockerfile
    container_name: meta-agent-uep-registry
    ports:
      - "3001:3001"  # HTTP API
      - "50051:50051"  # gRPC
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GRPC_PORT=50051
      - ETCD_ENDPOINTS=etcd:2379
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats-broker:4222
      - LOG_LEVEL=info
    volumes:
      - ./data/uep-registry:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.localhost`)"
      - "traefik.http.services.registry.loadbalancer.server.port=3001"

  # UEP Service - Universal Execution Protocol
  uep-service:
    build:
      context: ./containers/uep-service
      dockerfile: Dockerfile
    container_name: meta-agent-uep-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NATS_URL=nats://nats-broker:4222
      - FACTORY_CORE_URL=http://factory-core:3000
      - DOMAIN_AGENTS_URL=http://domain-agents:3001
      - UEP_REGISTRY_URL=http://uep-registry:3001
      - UEP_MODE=strict
      - UEP_VALIDATION_ENABLED=true
      - UEP_ENFORCEMENT_ENABLED=true
    volumes:
      - ./data/uep-service:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      uep-registry:
        condition: service_healthy
      nats-broker:
        condition: service_healthy
      factory-core:
        condition: service_healthy
      domain-agents:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uep.rule=Host(`uep.localhost`)"
      - "traefik.http.services.uep.loadbalancer.server.port=3003"

  # etcd - Distributed Service Registry
  etcd:
    image: quay.io/coreos/etcd:v3.5.7
    container_name: meta-agent-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_NAME=etcd-main
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd-main=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-1
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_AUTO_COMPACTION_RETENTION=1
    volumes:
      - etcd_data:/etcd-data
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # NATS Broker - JetStream
  nats-broker:
    build:
      context: ./containers/nats-broker
      dockerfile: Dockerfile
    container_name: meta-agent-nats-broker
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - nats_data:/data
      - ./logs/nats:/logs
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nats", "server", "check", "jetstream"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    command: ["nats-server", "-c", "/etc/nats/nats-server.conf"]

  # Observability - Prometheus + Grafana
  observability:
    build:
      context: ./containers/observability
      dockerfile: Dockerfile
    container_name: meta-agent-observability
    ports:
      - "9090:9090"  # Prometheus
      - "3004:3000"  # Grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - prometheus_data:/prometheus
      - grafana_data:/var/lib/grafana
      - ./containers/observability/prometheus-enhanced.yml:/etc/prometheus/prometheus.yml:ro
      - ./containers/observability/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./containers/observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./containers/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./containers/observability/grafana-dashboard-provisioning.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./containers/observability/grafana-dashboard-logs.json:/etc/grafana/provisioning/dashboards/logs.json:ro
      - ./containers/observability/grafana-dashboard-system-overview.json:/etc/grafana/provisioning/dashboards/system-overview.json:ro
      - ./containers/observability/grafana-dashboard-service-health.json:/etc/grafana/provisioning/dashboards/service-health.json:ro
      - ./containers/observability/grafana-dashboard-agent-coordination.json:/etc/grafana/provisioning/dashboards/agent-coordination.json:ro
    networks:
      - meta-agent-factory
      - monitoring
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metrics.rule=Host(`metrics.localhost`)"
      - "traefik.http.services.metrics.loadbalancer.server.port=3000"

  # Tempo - Distributed Tracing Storage
  tempo:
    image: grafana/tempo:2.3.1
    container_name: meta-agent-tempo
    ports:
      - "3200:3200"   # HTTP
      - "9095:9095"   # gRPC
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - tempo_data:/tmp/tempo
      - ./containers/observability/tempo.yml:/etc/tempo/tempo.yml:ro
    networks:
      - meta-agent-factory
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    command: ["-config.file=/etc/tempo/tempo.yml"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=Host(`tempo.localhost`)"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"

  # OpenTelemetry Collector - Trace Processing
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: meta-agent-otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
      - "13133:13133" # Health check
      - "1777:1777"   # pprof
      - "55679:55679" # zpages
    volumes:
      - ./containers/observability/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    networks:
      - meta-agent-factory
      - monitoring
    depends_on:
      tempo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    command: ["--config=/etc/otelcol-contrib/otel-collector.yml"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.otel.rule=Host(`otel.localhost`)"
      - "traefik.http.services.otel.loadbalancer.server.port=13133"

  # Alertmanager - Alert Management and Notifications
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: meta-agent-alertmanager
    ports:
      - "9093:9093"   # Alertmanager UI
    environment:
      # Email configuration
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com:587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-alerts@meta-agent-factory.com}
      - DEFAULT_EMAIL=${DEFAULT_EMAIL:-devops@meta-agent-factory.com}
      - CRITICAL_EMAIL=${CRITICAL_EMAIL:-oncall@meta-agent-factory.com}
      - AGENT_TEAM_EMAIL=${AGENT_TEAM_EMAIL:-agents@meta-agent-factory.com}
      - PLATFORM_TEAM_EMAIL=${PLATFORM_TEAM_EMAIL:-platform@meta-agent-factory.com}
      # Slack configuration
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # PagerDuty configuration
      - PAGERDUTY_INTEGRATION_KEY=${PAGERDUTY_INTEGRATION_KEY:-}
    volumes:
      - alertmanager_data:/alertmanager
      - ./containers/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./containers/observability/templates:/etc/alertmanager/templates:ro
    networks:
      - meta-agent-factory
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--log.level=info'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alerts.localhost`)"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  # Loki - Log Aggregation
  loki:
    build:
      context: ./containers/observability
      dockerfile: Dockerfile.loki
    container_name: meta-agent-loki
    ports:
      - "3100:3100"
      - "9096:9096"
    volumes:
      - loki_data:/loki
      - ./containers/observability/loki.yml:/etc/loki/loki.yml:ro
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.localhost`)"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  # Promtail - Log Collection
  promtail:
    build:
      context: ./containers/observability
      dockerfile: Dockerfile.promtail
    container_name: meta-agent-promtail
    ports:
      - "9080:9080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/var/log/factory-core:ro
      - ./logs:/var/log/domain-agents:ro
      - ./logs/nats:/var/log/nats:ro
      - ./containers/observability/promtail.yml:/etc/promtail/promtail.yml:ro
    networks:
      - meta-agent-factory
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Supporting Services
  redis:
    image: redis:7-alpine
    container_name: meta-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.1'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # Frontend (optional - can be external)
  frontend:
    image: nginx:alpine
    container_name: meta-agent-frontend
    ports:
      - "3002:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - meta-agent-factory
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.localhost`)"
      - "traefik.http.services.app.loadbalancer.server.port=80"

networks:
  # Frontend network - Public-facing services
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24
    labels:
      - "network.description=Frontend network for public-facing services"
  
  # Backend network - Internal service communication
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.2.0/24
    internal: false  # Allow external access for development
    labels:
      - "network.description=Backend network for internal service communication"
  
  # Database network - Persistent storage services
  database:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.3.0/24
    internal: true  # Isolated database network
    labels:
      - "network.description=Database network for persistent storage services"
  
  # Monitoring network - Observability and metrics
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.4.0/24
    labels:
      - "network.description=Monitoring network for observability services"
  
  # Legacy network - Backward compatibility
  meta-agent-factory:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    labels:
      - "network.description=Legacy network for backward compatibility"

volumes:
  # Named volumes for persistent data
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
  alertmanager_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  etcd_data:
    driver: local
  traefik_data:
    driver: local