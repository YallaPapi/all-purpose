version: '3.8'

services:
  # ================================
  # INFRASTRUCTURE SERVICES
  # ================================
  
  # API Gateway - Traefik with Istio Integration
  api-gateway:
    build:
      context: ./containers/api-gateway
      dockerfile: Dockerfile
    container_name: meta-agent-factory-gateway
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/acme.json:/acme.json
    networks:
      - meta-agent-factory
    depends_on:
      - agent-registry-service
      - consul
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"

  # NATS Broker - JetStream
  nats-broker:
    build:
      context: ./containers/nats-broker
      dockerfile: Dockerfile
    container_name: meta-agent-nats-broker
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - ./data/nats:/data
      - ./logs/nats:/logs
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: ["nats-server", "-c", "/etc/nats/nats-server.conf"]

  # UEP Service - Universal Execution Protocol
  uep-service:
    build:
      context: ./containers/uep-service
      dockerfile: Dockerfile
    container_name: meta-agent-uep-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NATS_URL=nats://nats-broker:4222
      - UEP_MODE=strict
      - UEP_VALIDATION_ENABLED=true
      - UEP_ENFORCEMENT_ENABLED=true
    volumes:
      - ./data/uep-service:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - nats-broker
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uep.rule=Host(`uep.localhost`)"
      - "traefik.http.services.uep.loadbalancer.server.port=3003"

  # ================================
  # SERVICE DISCOVERY & COORDINATION
  # ================================

  # Consul - Service Discovery
  consul:
    image: consul:1.16
    container_name: meta-agent-consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    volumes:
      - ./data/consul:/consul/data
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: ["consul", "agent", "-server", "-bootstrap-expect=1", "-ui", "-client=0.0.0.0"]

  # Agent Registry Service
  agent-registry-service:
    build:
      context: ./microservices/agent-registry-service
      dockerfile: Dockerfile
    container_name: agent-registry-service
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - DB_HOST=postgres-registry
      - DB_NAME=agent_registry
      - DB_USER=registry_user
      - DB_PASSWORD=registry_password
      - REDIS_HOST=redis-registry
      - CONSUL_HOST=consul
    volumes:
      - ./data/agent-registry:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - postgres-registry
      - redis-registry
      - consul
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.localhost`)"
      - "traefik.http.services.registry.loadbalancer.server.port=3010"

  # Agent Coordination Service
  agent-coordination-service:
    build:
      context: ./microservices/agent-coordination-service
      dockerfile: Dockerfile
    container_name: agent-coordination-service
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - DB_HOST=postgres-coordination
      - DB_NAME=agent_coordination
      - DB_USER=coordination_user
      - DB_PASSWORD=coordination_password
      - REDIS_HOST=redis-coordination
      - NATS_URL=nats://nats-broker:4222
      - REGISTRY_URL=http://agent-registry-service:3010
    volumes:
      - ./data/agent-coordination:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - postgres-coordination
      - redis-coordination
      - nats-broker
      - agent-registry-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.coordination.rule=Host(`coordination.localhost`)"
      - "traefik.http.services.coordination.loadbalancer.server.port=3011"

  # ================================
  # CORE META-AGENT SERVICES
  # ================================

  # Backend Agent Service
  backend-agent-service:
    build:
      context: ./microservices/backend-agent-service
      dockerfile: Dockerfile
    container_name: backend-agent-service
    ports:
      - "3020:3020"
    environment:
      - NODE_ENV=production
      - PORT=3020
      - DB_HOST=postgres-backend
      - NATS_URL=nats://nats-broker:4222
      - REGISTRY_URL=http://agent-registry-service:3010
      - UEP_URL=http://uep-service:3003
    volumes:
      - ./data/backend-agent:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - postgres-backend
      - nats-broker
      - agent-registry-service
      - uep-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-agent.rule=Host(`backend.localhost`)"
      - "traefik.http.services.backend-agent.loadbalancer.server.port=3020"

  # Frontend Agent Service
  frontend-agent-service:
    build:
      context: ./microservices/frontend-agent-service
      dockerfile: Dockerfile
    container_name: frontend-agent-service
    ports:
      - "3021:3021"
    environment:
      - NODE_ENV=production
      - PORT=3021
      - DB_HOST=postgres-frontend
      - NATS_URL=nats://nats-broker:4222
      - REGISTRY_URL=http://agent-registry-service:3010
      - UEP_URL=http://uep-service:3003
    volumes:
      - ./data/frontend-agent:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - postgres-frontend
      - nats-broker
      - agent-registry-service
      - uep-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-agent.rule=Host(`frontend.localhost`)"
      - "traefik.http.services.frontend-agent.loadbalancer.server.port=3021"

  # DevOps Agent Service
  devops-agent-service:
    build:
      context: ./microservices/devops-agent-service
      dockerfile: Dockerfile
    container_name: devops-agent-service
    ports:
      - "3022:3022"
    environment:
      - NODE_ENV=production
      - PORT=3022
      - DB_HOST=postgres-devops
      - NATS_URL=nats://nats-broker:4222
      - REGISTRY_URL=http://agent-registry-service:3010
      - UEP_URL=http://uep-service:3003
    volumes:
      - ./data/devops-agent:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - postgres-devops
      - nats-broker
      - agent-registry-service
      - uep-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devops-agent.rule=Host(`devops.localhost`)"
      - "traefik.http.services.devops-agent.loadbalancer.server.port=3022"

  # QA Agent Service
  qa-agent-service:
    build:
      context: ./microservices/qa-agent-service
      dockerfile: Dockerfile
    container_name: qa-agent-service
    ports:
      - "3023:3023"
    environment:
      - NODE_ENV=production
      - PORT=3023
      - DB_HOST=postgres-qa
      - NATS_URL=nats://nats-broker:4222
      - REGISTRY_URL=http://agent-registry-service:3010
      - UEP_URL=http://uep-service:3003
    volumes:
      - ./data/qa-agent:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - postgres-qa
      - nats-broker
      - agent-registry-service
      - uep-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qa-agent.rule=Host(`qa.localhost`)"
      - "traefik.http.services.qa-agent.loadbalancer.server.port=3023"

  # Documentation Agent Service
  documentation-agent-service:
    build:
      context: ./microservices/documentation-agent-service
      dockerfile: Dockerfile
    container_name: documentation-agent-service
    ports:
      - "3024:3024"
    environment:
      - NODE_ENV=production
      - PORT=3024
      - DB_HOST=postgres-documentation
      - NATS_URL=nats://nats-broker:4222
      - REGISTRY_URL=http://agent-registry-service:3010
      - UEP_URL=http://uep-service:3003
    volumes:
      - ./data/documentation-agent:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - postgres-documentation
      - nats-broker
      - agent-registry-service
      - uep-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs-agent.rule=Host(`docs.localhost`)"
      - "traefik.http.services.docs-agent.loadbalancer.server.port=3024"

  # ================================
  # SPECIALIZED PROCESSING SERVICES
  # ================================

  # PRD Parser Service
  prd-parser-service:
    build:
      context: ./microservices/prd-parser-service
      dockerfile: Dockerfile
    container_name: prd-parser-service
    ports:
      - "3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - MONGODB_URL=mongodb://mongo-templates:27017/prd_parser
      - NATS_URL=nats://nats-broker:4222
      - REGISTRY_URL=http://agent-registry-service:3010
    volumes:
      - ./data/prd-parser:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - mongo-templates
      - nats-broker
      - agent-registry-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prd-parser.rule=Host(`prd.localhost`)"
      - "traefik.http.services.prd-parser.loadbalancer.server.port=3030"

  # Template Engine Service
  template-engine-service:
    build:
      context: ./microservices/template-engine-service
      dockerfile: Dockerfile
    container_name: template-engine-service
    ports:
      - "3031:3031"
    environment:
      - NODE_ENV=production
      - PORT=3031
      - MONGODB_URL=mongodb://mongo-templates:27017/template_engine
      - NATS_URL=nats://nats-broker:4222
      - REGISTRY_URL=http://agent-registry-service:3010
    volumes:
      - ./data/template-engine:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - mongo-templates
      - nats-broker
      - agent-registry-service
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.templates.rule=Host(`templates.localhost`)"
      - "traefik.http.services.templates.loadbalancer.server.port=3031"

  # ================================
  # DATA SERVICES
  # ================================

  # Agent Memory Service
  agent-memory-service:
    build:
      context: ./microservices/agent-memory-service
      dockerfile: Dockerfile
    container_name: agent-memory-service
    ports:
      - "3040:3040"
    environment:
      - NODE_ENV=production
      - PORT=3040
      - REDIS_HOST=redis-memory
      - POSTGRES_HOST=postgres-memory
      - NATS_URL=nats://nats-broker:4222
    volumes:
      - ./data/agent-memory:/app/data
      - ./logs:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      - redis-memory
      - postgres-memory
      - nats-broker
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memory.rule=Host(`memory.localhost`)"
      - "traefik.http.services.memory.loadbalancer.server.port=3040"

  # ================================
  # DATABASE SERVICES
  # ================================

  # PostgreSQL Cluster for Registry
  postgres-registry:
    image: postgres:15-alpine
    container_name: postgres-registry
    environment:
      - POSTGRES_DB=agent_registry
      - POSTGRES_USER=registry_user
      - POSTGRES_PASSWORD=registry_password
    volumes:
      - ./data/postgres/registry:/var/lib/postgresql/data
      - ./sql/registry-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # PostgreSQL for Coordination
  postgres-coordination:
    image: postgres:15-alpine
    container_name: postgres-coordination
    environment:
      - POSTGRES_DB=agent_coordination
      - POSTGRES_USER=coordination_user
      - POSTGRES_PASSWORD=coordination_password
    volumes:
      - ./data/postgres/coordination:/var/lib/postgresql/data
      - ./sql/coordination-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # PostgreSQL for Backend Agent
  postgres-backend:
    image: postgres:15-alpine
    container_name: postgres-backend
    environment:
      - POSTGRES_DB=backend_agent
      - POSTGRES_USER=backend_user
      - POSTGRES_PASSWORD=backend_password
    volumes:
      - ./data/postgres/backend:/var/lib/postgresql/data
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # PostgreSQL for Frontend Agent
  postgres-frontend:
    image: postgres:15-alpine
    container_name: postgres-frontend
    environment:
      - POSTGRES_DB=frontend_agent
      - POSTGRES_USER=frontend_user
      - POSTGRES_PASSWORD=frontend_password
    volumes:
      - ./data/postgres/frontend:/var/lib/postgresql/data
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # PostgreSQL for DevOps Agent
  postgres-devops:
    image: postgres:15-alpine
    container_name: postgres-devops
    environment:
      - POSTGRES_DB=devops_agent
      - POSTGRES_USER=devops_user
      - POSTGRES_PASSWORD=devops_password
    volumes:
      - ./data/postgres/devops:/var/lib/postgresql/data
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # PostgreSQL for QA Agent
  postgres-qa:
    image: postgres:15-alpine
    container_name: postgres-qa
    environment:
      - POSTGRES_DB=qa_agent
      - POSTGRES_USER=qa_user
      - POSTGRES_PASSWORD=qa_password
    volumes:
      - ./data/postgres/qa:/var/lib/postgresql/data
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # PostgreSQL for Documentation Agent
  postgres-documentation:
    image: postgres:15-alpine
    container_name: postgres-documentation
    environment:
      - POSTGRES_DB=documentation_agent
      - POSTGRES_USER=docs_user
      - POSTGRES_PASSWORD=docs_password
    volumes:
      - ./data/postgres/documentation:/var/lib/postgresql/data
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # PostgreSQL for Memory Service
  postgres-memory:
    image: postgres:15-alpine
    container_name: postgres-memory
    environment:
      - POSTGRES_DB=agent_memory
      - POSTGRES_USER=memory_user
      - POSTGRES_PASSWORD=memory_password
    volumes:
      - ./data/postgres/memory:/var/lib/postgresql/data
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # ================================
  # REDIS CLUSTER
  # ================================

  # Redis for Registry
  redis-registry:
    image: redis:7-alpine
    container_name: redis-registry
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis/registry:/data
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Redis for Coordination
  redis-coordination:
    image: redis:7-alpine
    container_name: redis-coordination
    ports:
      - "6381:6379"
    volumes:
      - ./data/redis/coordination:/data
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Redis for Memory Service
  redis-memory:
    image: redis:7-alpine
    container_name: redis-memory
    ports:
      - "6382:6379"
    volumes:
      - ./data/redis/memory:/data
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ================================
  # MONGODB CLUSTER
  # ================================

  # MongoDB for Templates
  mongo-templates:
    image: mongo:7
    container_name: mongo-templates
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin_password
    volumes:
      - ./data/mongodb/templates:/data/db
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # ================================
  # OBSERVABILITY
  # ================================

  # Observability - Prometheus + Grafana
  observability:
    build:
      context: ./containers/observability
      dockerfile: Dockerfile
    container_name: meta-agent-observability
    ports:
      - "9090:9090"  # Prometheus
      - "3004:3000"  # Grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./data/prometheus:/prometheus
      - ./data/grafana:/var/lib/grafana
    networks:
      - meta-agent-factory
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metrics.rule=Host(`metrics.localhost`)"
      - "traefik.http.services.metrics.loadbalancer.server.port=3000"

  # Jaeger for Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: meta-agent-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - meta-agent-factory
    restart: unless-stopped

networks:
  meta-agent-factory:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  prometheus_data:
  grafana_data:
  postgres_registry_data:
  postgres_coordination_data:
  postgres_backend_data:
  postgres_frontend_data:
  postgres_devops_data:
  postgres_qa_data:
  postgres_documentation_data:
  postgres_memory_data:
  redis_registry_data:
  redis_coordination_data:
  redis_memory_data:
  mongodb_templates_data:
  nats_data:
  consul_data: