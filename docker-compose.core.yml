# Minimal Docker Compose - ZAD Mandate Step 2
# Only includes core services needed to prove the containerized workflow
#
# Services:
# 1. factory-core - Meta-agent factory
# 2. domain-agents - Single domain agent container  
# 3. nats - Message broker
# 4. redis - State storage

version: '3.8'

services:
  # NATS Message Broker
  nats:
    image: nats:2.10-alpine
    container_name: core-nats
    ports:
      - "4222:4222"     # Client connections
      - "8222:8222"     # HTTP monitoring
      - "6222:6222"     # Cluster connections
    command: 
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    volumes:
      - nats_data:/data
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis State Storage
  redis:
    image: redis:7-alpine
    container_name: core-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Factory Core Service
  factory-core:
    build:
      context: ./containers/factory-core
      dockerfile: Dockerfile.simple
    container_name: core-factory
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Domain Agents Service
  domain-agents:
    build:
      context: ./containers/domain-agents
      dockerfile: Dockerfile
    container_name: core-domain-agents
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      - nats
      - redis
      - factory-core
    networks:
      - core-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  core-network:
    driver: bridge
    name: meta-agent-core

volumes:
  nats_data:
    name: core-nats-data
  redis_data:
    name: core-redis-data