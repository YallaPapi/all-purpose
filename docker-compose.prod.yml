# ZAD MANDATE PHASE 4 - PRODUCTION DOCKER COMPOSE  
# Uses EXISTING containers and services - NO FAKE SHIT
# All services reference actual implementations from containers/ and services/
#
# This configuration includes:
# 1. REAL Factory Core (containers/factory-core with RealMetaAgentFactory)
# 2. REAL Domain Agents (containers/domain-agents with Dockerfile.working)
# 3. RAG-Enhanced Factory Test (step2-factory-test.ts - 774 lines with REAL RAG integration)
# 4. REAL UEP Services (UEP Registry + UEP Service from existing containers)
# 5. Production infrastructure (NATS, Redis, PostgreSQL)
#
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ===== REAL FACTORY CORE FROM EXISTING CONTAINERS =====
  # Uses containers/factory-core/Dockerfile.working with RealMetaAgentFactory
  factory-core:
    build:
      context: ./containers/factory-core
      dockerfile: Dockerfile.working
    container_name: prod-meta-agent-factory-core
    ports:
      - "3000:3000"  # Factory Core API
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NATS_URL=nats://nats-broker:4222
      - REDIS_URL=redis://redis:6379
      - UEP_REGISTRY_URL=http://uep-registry:3001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - LOG_LEVEL=info
      # Production Monitoring
      - ENABLE_METRICS=true
      - OTEL_SERVICE_NAME=factory-core
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./data/factory-core:/app/data
      - ./logs/factory-core:/app/logs
      - factory_generated_projects:/app/generated
    networks:
      - meta-agent-factory
    depends_on:
      nats-broker:
        condition: service_healthy
      redis:
        condition: service_healthy
      # uep-registry:
      #   condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===== RAG-ENHANCED FACTORY TEST SERVICE =====
  # Uses step2-factory-test.ts (774 lines) - REAL RAG integration with contextHelpers
  rag-factory-test:
    build:
      context: .
      dockerfile: Dockerfile.rag-factory-test
    container_name: prod-rag-factory-test
    ports:
      - "3007:3007"  # RAG Factory Test API
    environment:
      - NODE_ENV=production
      - PORT=3007
      - NATS_URL=nats://nats-broker:4222
      - REDIS_URL=redis://redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - LOG_LEVEL=info
      # RAG System Vector Database
      - UPSTASH_VECTOR_REST_URL=${UPSTASH_VECTOR_REST_URL}
      - UPSTASH_VECTOR_REST_TOKEN=${UPSTASH_VECTOR_REST_TOKEN}
      - UPSTASH_VECTOR_REST_READONLY_TOKEN=${UPSTASH_VECTOR_REST_READONLY_TOKEN}
      # Redis/KV for RAG system
      - KV_REST_API_URL=${KV_REST_API_URL}
      - KV_REST_API_TOKEN=${KV_REST_API_TOKEN}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
    volumes:
      - ./data/rag-factory:/app/data
      - ./logs/rag-factory:/app/logs
      - ./rag-system:/app/rag-system
      - rag_factory_projects:/app/generated
    networks:
      - meta-agent-factory
    depends_on:
      nats-broker:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ===== REAL DOMAIN AGENTS FROM EXISTING CONTAINERS =====
  # Uses containers/domain-agents/Dockerfile.working with 5 specialist agents
  domain-agents:
    build:
      context: ./containers/domain-agents
      dockerfile: Dockerfile.working
    container_name: prod-domain-agents
    ports:
      - "3002:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NATS_URL=nats://nats-broker:4222
      - FACTORY_CORE_URL=http://factory-core:3000
      - UEP_REGISTRY_URL=http://uep-registry:3001
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=domain-agents
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    volumes:
      - ./data/domain-agents:/app/data
      - ./logs/domain-agents:/app/logs
      - domain_agents_output:/app/generated
    networks:
      - meta-agent-factory
    depends_on:
      nats-broker:
        condition: service_healthy
      factory-core:
        condition: service_healthy
      # uep-registry:
      #   condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/src/nats-health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '0.8'
        reservations:
          memory: 256M
          cpus: '0.2'

  # ===== REAL UEP REGISTRY FROM EXISTING SERVICES =====
  # Uses services/uep-registry/Dockerfile.working - REAL UEP service discovery
  uep-registry:
    build:
      context: ./services/uep-registry
      dockerfile: Dockerfile.working
    container_name: prod-uep-registry
    ports:
      - "3001:3001"  # HTTP API
      - "50051:50051"  # gRPC
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GRPC_PORT=50051
      - ETCD_ENDPOINTS=etcd:2379
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats-broker:4222
      - LOG_LEVEL=info
    volumes:
      - ./data/uep-registry:/app/data
      - ./logs/uep-registry:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats-broker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # ===== REAL UEP SERVICE FROM EXISTING CONTAINERS =====
  # Uses containers/uep-service/Dockerfile.working - REAL UEP protocol processor
  uep-service:
    build:
      context: ./containers/uep-service
      dockerfile: Dockerfile.working
    container_name: prod-uep-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NATS_URL=nats://nats-broker:4222
      - FACTORY_CORE_URL=http://factory-core:3000
      - DOMAIN_AGENTS_URL=http://domain-agents:3001
      - UEP_REGISTRY_URL=http://uep-registry:3001
      - UEP_MODE=strict
      - UEP_VALIDATION_ENABLED=true
      - UEP_ENFORCEMENT_ENABLED=true
    volumes:
      - ./data/uep-service:/app/data
      - ./logs/uep-service:/app/logs
    networks:
      - meta-agent-factory
    depends_on:
      uep-registry:
        condition: service_healthy
      nats-broker:
        condition: service_healthy
      factory-core:
        condition: service_healthy
      domain-agents:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # ===== API GATEWAY FROM EXISTING CONTAINERS =====
  # Uses containers/api-gateway/Dockerfile - REAL Traefik gateway
  api-gateway:
    build:
      context: ./containers/api-gateway
      dockerfile: Dockerfile
    container_name: prod-api-gateway
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/data
      - ./containers/api-gateway/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - meta-agent-factory
    depends_on:
      factory-core:
        condition: service_healthy
      domain-agents:
        condition: service_healthy
      uep-service:
        condition: service_healthy
      uep-registry:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # ===== PRODUCTION INFRASTRUCTURE FROM EXISTING CONTAINERS =====
  
  # NATS Broker with JetStream - Uses containers/nats-broker/Dockerfile.simple
  nats-broker:
    build:
      context: ./containers/nats-broker
      dockerfile: Dockerfile.simple
    container_name: prod-nats-broker
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - nats_data:/data
      - ./logs/nats:/logs
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8222/varz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # etcd - Distributed Service Registry (for UEP Registry)
  etcd:
    image: quay.io/coreos/etcd:v3.5.7
    container_name: prod-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_NAME=etcd-main
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd-main=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=etcd-cluster-1
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_AUTO_COMPACTION_RETENTION=1
    volumes:
      - etcd_data:/etcd-data
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Redis - Caching and session storage
  redis:
    image: redis:7-alpine
    container_name: prod-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 128M
          cpus: '0.1'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ===== PRODUCTION MONITORING FROM EXISTING CONTAINERS =====
  # Uses containers/observability/Dockerfile with Prometheus + Grafana stack
  observability:
    build:
      context: ./containers/observability
      dockerfile: Dockerfile
    container_name: prod-observability
    ports:
      - "9090:9090"  # Prometheus
      - "3005:3000"  # Grafana (avoid conflict with factory-core:3000)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - prometheus_data:/prometheus
      - grafana_data:/var/lib/grafana
      - ./containers/observability/prometheus-enhanced.yml:/etc/prometheus/prometheus.yml:ro
      - ./containers/observability/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./containers/observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./containers/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./containers/observability/grafana-dashboard-provisioning.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./containers/observability/grafana-dashboard-logs.json:/etc/grafana/provisioning/dashboards/logs.json:ro
      - ./containers/observability/grafana-dashboard-system-overview.json:/etc/grafana/provisioning/dashboards/system-overview.json:ro
      - ./containers/observability/grafana-dashboard-service-health.json:/etc/grafana/provisioning/dashboards/service-health.json:ro
      - ./containers/observability/grafana-dashboard-agent-coordination.json:/etc/grafana/provisioning/dashboards/agent-coordination.json:ro
    networks:
      - meta-agent-factory
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Tempo - Distributed Tracing Storage
  tempo:
    image: grafana/tempo:2.3.1
    container_name: prod-tempo
    ports:
      - "3200:3200"   # HTTP
      - "9095:9095"   # gRPC
    volumes:
      - tempo_data:/tmp/tempo
      - ./containers/observability/tempo.yml:/etc/tempo/tempo.yml:ro
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    command: ["-config.file=/etc/tempo/tempo.yml"]

  # OpenTelemetry Collector - Trace Processing
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: prod-otel-collector
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8889:8889"   # Prometheus metrics exporter
      - "13133:13133" # Health check
    volumes:
      - ./containers/observability/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    networks:
      - meta-agent-factory
    depends_on:
      tempo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    command: ["--config=/etc/otelcol-contrib/otel-collector.yml"]

  # Alertmanager - Alert Management
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: prod-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
      - ./containers/observability/alertmanager-simple.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./containers/observability/templates:/etc/alertmanager/templates:ro
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--log.level=info'

  # Loki - Log Aggregation
  loki:
    build:
      context: ./containers/observability
      dockerfile: Dockerfile.loki
    container_name: prod-loki
    ports:
      - "3100:3100"
      - "9096:9096"
    volumes:
      - loki_data:/loki
      - ./containers/observability/loki.yml:/etc/loki/loki.yml:ro
    networks:
      - meta-agent-factory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Promtail - Log Collection
  promtail:
    build:
      context: ./containers/observability
      dockerfile: Dockerfile.promtail
    container_name: prod-promtail
    ports:
      - "9080:9080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/var/log/factory-core:ro
      - ./logs:/var/log/domain-agents:ro
      - ./logs/nats:/var/log/nats:ro
      - ./containers/observability/promtail.yml:/etc/promtail/promtail.yml:ro
    networks:
      - meta-agent-factory
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "timeout 5 bash -c '</dev/tcp/localhost/9080' && echo 'OK' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

networks:
  meta-agent-factory:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
    labels:
      - "network.description=Production Meta-Agent Factory Network"
      - "network.environment=production"

volumes:
  # Infrastructure data
  nats_data:
    driver: local
    labels:
      - "volume.description=NATS JetStream persistent storage"
  etcd_data:
    driver: local
    labels:
      - "volume.description=etcd distributed service registry storage"
  redis_data:
    driver: local
    labels:
      - "volume.description=Redis persistent storage"
  traefik_data:
    driver: local
    labels:
      - "volume.description=Traefik API gateway configuration"
  
  # Monitoring data
  prometheus_data:
    driver: local
    labels:
      - "volume.description=Prometheus metrics storage"
  grafana_data:
    driver: local
    labels:
      - "volume.description=Grafana dashboards and configuration"
  tempo_data:
    driver: local
    labels:
      - "volume.description=Tempo distributed tracing storage"
  loki_data:
    driver: local
    labels:
      - "volume.description=Loki log aggregation storage"
  alertmanager_data:
    driver: local
    labels:
      - "volume.description=Alertmanager configuration and data"
  
  # Factory and agent output volumes
  factory_generated_projects:
    driver: local
    labels:
      - "volume.description=Factory-generated project outputs"
  rag_factory_projects:
    driver: local
    labels:
      - "volume.description=RAG Factory Test generated projects"
  domain_agents_output:
    driver: local
    labels:
      - "volume.description=Domain agents generated code"