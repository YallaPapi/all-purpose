# UEP Meta-Agent Factory with Service Discovery Integration
# Task 191.4: Complete Docker Compose setup with service discovery

version: '3.8'

# Shared configurations
x-common-environment: &common-environment
  NODE_ENV: ${NODE_ENV:-development}
  UEP_ENVIRONMENT: ${UEP_ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-service-discovery: &service-discovery-config
  REGISTRY_TYPE: ${REGISTRY_TYPE:-redis}
  REDIS_HOST: redis-registry
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  CONSUL_HOST: consul-server
  CONSUL_PORT: 8500
  CONSUL_TOKEN: ${CONSUL_TOKEN:-}
  SERVICE_DISCOVERY_ENABLED: true
  AUTO_REGISTER: true
  HEALTH_CHECK_INTERVAL: 30000

x-agent-defaults: &agent-defaults
  restart: unless-stopped
  networks:
    - uep-network
  environment:
    <<: *common-environment
    <<: *service-discovery-config
  healthcheck:
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  depends_on:
    - redis-registry
    - consul-server
    - service-discovery-monitor

networks:
  uep-network:
    driver: bridge
    name: uep-network
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

services:
  # ===========================================
  # SERVICE DISCOVERY INFRASTRUCTURE
  # ===========================================

  # Redis Service Registry (Primary)
  redis-registry:
    image: redis:7.2-alpine
    container_name: uep-redis-registry
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./containers/service-discovery/redis/redis-dev.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      REDIS_REPLICATION_MODE: master
    networks:
      - uep-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Consul Service Registry (Secondary/Backup)
  consul-server:
    build:
      context: ./containers/consul-server
      dockerfile: Dockerfile
      target: development
    container_name: uep-consul-server
    ports:
      - "8500:8500"  # HTTP API and UI
      - "8600:8600"  # DNS
      - "8300:8300"  # Server RPC
    volumes:
      - consul-data:/consul/data
      - consul-logs:/consul/logs
      - ./containers/consul-server/config/consul-dev.hcl:/consul/config/consul.hcl:ro
    environment:
      CONSUL_DATACENTER: uep-dev
      CONSUL_NODE_NAME: consul-dev-server
      CONSUL_LOG_LEVEL: INFO
      CONSUL_BOOTSTRAP_EXPECT: 1
    command: ["consul", "agent", "-config-dir=/consul/config", "-data-dir=/consul/data"]
    networks:
      - uep-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Service Discovery Monitor & Dashboard
  service-discovery-monitor:
    build:
      context: ./containers/service-discovery
      dockerfile: Dockerfile.monitor
    container_name: uep-service-discovery-monitor
    ports:
      - "8090:8090"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      MONITOR_PORT: 8090
      DASHBOARD_ENABLED: true
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis-registry
      - consul-server
    networks:
      - uep-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================
  # UEP META-AGENT FACTORY CORE
  # ===========================================

  # Factory Core Service
  factory-core:
    build:
      context: ./containers/factory-core
      dockerfile: Dockerfile
    container_name: uep-factory-core
    <<: *agent-defaults
    ports:
      - "3000:3000"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: factory-core
      AGENT_NAME: "UEP Meta-Agent Factory Core"
      SERVICE_PORT: 3000
      CAPABILITIES: "orchestration,coordination,factory-management"
    volumes:
      - factory-data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]

  # Infrastructure Orchestrator Agent
  infra-orchestrator:
    build:
      context: ./src/meta-agents/infra-orchestrator
      dockerfile: Dockerfile
    container_name: uep-infra-orchestrator
    <<: *agent-defaults
    ports:
      - "3001:3001"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: infra-orchestrator
      AGENT_NAME: "Infrastructure Orchestrator Agent"
      SERVICE_PORT: 3001
      CAPABILITIES: "orchestration,infrastructure,project-management"
    volumes:
      - orchestrator-data:/app/data
      - ./generated:/app/generated
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]

  # PRD Parser Agent
  prd-parser:
    build:
      context: ./src/meta-agents/prd-parser
      dockerfile: Dockerfile
    container_name: uep-prd-parser
    <<: *agent-defaults
    ports:
      - "3002:3002"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: prd-parser
      AGENT_NAME: "PRD Parser Agent"
      SERVICE_PORT: 3002
      CAPABILITIES: "parsing,validation,analysis"
    volumes:
      - parser-data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]

  # Scaffold Generator Agent
  scaffold-generator:
    build:
      context: ./src/meta-agents/scaffold-generator
      dockerfile: Dockerfile
    container_name: uep-scaffold-generator
    <<: *agent-defaults
    ports:
      - "3003:3003"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: scaffold-generator
      AGENT_NAME: "Scaffold Generator Agent"
      SERVICE_PORT: 3003
      CAPABILITIES: "generation,scaffolding,templating"
    volumes:
      - scaffold-data:/app/data
      - ./generated:/app/generated
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]

  # Backend Agent
  backend-agent:
    build:
      context: ./src/meta-agents/backend-agent
      dockerfile: Dockerfile
    container_name: uep-backend-agent
    <<: *agent-defaults
    ports:
      - "3004:3004"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: backend-agent
      AGENT_NAME: "Backend Development Agent"
      SERVICE_PORT: 3004
      CAPABILITIES: "backend-development,api-creation,database-integration"
    volumes:
      - backend-data:/app/data
      - ./generated:/app/generated
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]

  # Frontend Agent
  frontend-agent:
    build:
      context: ./src/meta-agents/frontend-agent
      dockerfile: Dockerfile
    container_name: uep-frontend-agent
    <<: *agent-defaults
    ports:
      - "3005:3005"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: frontend-agent
      AGENT_NAME: "Frontend Development Agent"
      SERVICE_PORT: 3005
      CAPABILITIES: "frontend-development,ui-creation,component-generation"
    volumes:
      - frontend-data:/app/data
      - ./generated:/app/generated
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3005/health"]

  # ===========================================
  # DOMAIN AGENTS
  # ===========================================

  # Domain Agents Service (Unified)
  domain-agents:
    build:
      context: ./containers/domain-agents
      dockerfile: Dockerfile
    container_name: uep-domain-agents
    <<: *agent-defaults
    ports:
      - "3010:3010"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: domain-agent-manager
      AGENT_NAME: "Domain Agent Manager"
      SERVICE_PORT: 3010
      CAPABILITIES: "domain-management,agent-coordination,multi-domain"
      ENABLED_DOMAINS: "backend,frontend,devops,qa,documentation"
    volumes:
      - domain-data:/app/data
      - ./generated:/app/generated
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]

  # ===========================================
  # UEP PROTOCOL & MESSAGING
  # ===========================================

  # UEP Service
  uep-service:
    build:
      context: ./containers/uep-service
      dockerfile: Dockerfile
    container_name: uep-service
    <<: *agent-defaults
    ports:
      - "3020:3020"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: uep-service
      AGENT_NAME: "UEP Protocol Service"
      SERVICE_PORT: 3020
      CAPABILITIES: "protocol-enforcement,validation,event-processing"
    volumes:
      - uep-data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3020/health"]

  # NATS Event Broker
  nats-broker:
    build:
      context: ./containers/nats-broker
      dockerfile: Dockerfile
    container_name: uep-nats-broker
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
      - "6222:6222"  # Clustering
    volumes:
      - nats-data:/data
      - ./containers/nats-broker/nats-server.conf:/etc/nats/nats-server.conf:ro
    command: ["-c", "/etc/nats/nats-server.conf"]
    networks:
      - uep-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ===========================================
  # API GATEWAY & LOAD BALANCER
  # ===========================================

  # API Gateway (Traefik)
  api-gateway:
    image: traefik:v3.0
    container_name: uep-api-gateway
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./containers/api-gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./containers/api-gateway/dynamic:/etc/traefik/dynamic:ro
      - traefik-data:/data
    environment:
      <<: *common-environment
      <<: *service-discovery-config
    networks:
      - uep-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`gateway.uep.local`)"
      - "traefik.http.routers.dashboard.service=api@internal"
    restart: unless-stopped

  # ===========================================
  # OBSERVABILITY & MONITORING
  # ===========================================

  # Observability Dashboard
  observability:
    build:
      context: ./containers/observability
      dockerfile: Dockerfile
    container_name: uep-observability
    ports:
      - "3030:3030"
    environment:
      <<: *common-environment
      DASHBOARD_PORT: 3030
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      REDIS_URL: redis://redis-registry:6379
      CONSUL_URL: http://consul-server:8500
    volumes:
      - observability-data:/app/data
      - ./logs:/app/logs
    depends_on:
      - redis-registry
      - consul-server
      - prometheus
    networks:
      - uep-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/health"]
    restart: unless-stopped

  # Prometheus Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: uep-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./containers/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - uep-network
    restart: unless-stopped

  # Grafana Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: uep-grafana
    ports:
      - "3031:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./containers/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./containers/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - uep-network
    restart: unless-stopped

  # ===========================================
  # DEVELOPMENT & TESTING SERVICES
  # ===========================================

  # Service Discovery Test Agent
  test-agent:
    build:
      context: ./containers/service-discovery
      dockerfile: Dockerfile.test-agent
    container_name: uep-test-agent
    profiles:
      - test
      - development
    ports:
      - "3099:3099"
    environment:
      <<: *common-environment
      <<: *service-discovery-config
      AGENT_TYPE: test-agent
      AGENT_NAME: "Service Discovery Test Agent"
      SERVICE_PORT: 3099
      CAPABILITIES: "testing,validation,load-generation"
      TEST_MODE: true
    depends_on:
      - redis-registry
      - consul-server
    networks:
      - uep-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3099/health"]

# ===========================================
# PERSISTENT VOLUMES
# ===========================================

volumes:
  # Service Discovery
  redis-data:
    name: uep-redis-data
  consul-data:
    name: uep-consul-data
  consul-logs:
    name: uep-consul-logs

  # Factory Services
  factory-data:
    name: uep-factory-data
  orchestrator-data:
    name: uep-orchestrator-data
  parser-data:
    name: uep-parser-data
  scaffold-data:
    name: uep-scaffold-data
  backend-data:
    name: uep-backend-data
  frontend-data:
    name: uep-frontend-data
  domain-data:
    name: uep-domain-data

  # UEP Protocol
  uep-data:
    name: uep-service-data
  nats-data:
    name: uep-nats-data

  # Gateway & Observability
  traefik-data:
    name: uep-traefik-data
  observability-data:
    name: uep-observability-data
  prometheus-data:
    name: uep-prometheus-data
  grafana-data:
    name: uep-grafana-data