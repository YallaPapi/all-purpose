# Full Docker Compose - ZAD Mandate Step 4
# Complete system with all supporting services and agents

networks:
  meta-agent-factory:
    driver: bridge
    name: meta-agent-factory-full

volumes:
  nats_data:
    name: full-nats-data
  redis_data:
    name: full-redis-data
  postgres_data:
    name: full-postgres-data

services:
  # NATS Message Broker with JetStream
  nats:
    image: nats:2.10-alpine
    container_name: full-nats
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    command: 
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
      - "--cluster_name=meta-agent-cluster"
    volumes:
      - nats_data:/data
    networks:
      - meta-agent-factory
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: full-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - meta-agent-factory
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # PostgreSQL for persistent data
  postgres:
    image: postgres:15-alpine
    container_name: full-postgres
    environment:
      POSTGRES_DB: meta_agent_factory
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meta-agent-factory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d meta_agent_factory"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Factory Core Service
  factory-core:
    build:
      context: ./containers/factory-core
      dockerfile: Dockerfile.simple
    container_name: full-factory-core
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://factory_user:factory_password@postgres:5432/meta_agent_factory
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # Backend Domain Agent
  backend-agent:
    build:
      context: ./containers/domain-agents
      dockerfile: Dockerfile
    container_name: full-backend-agent
    environment:
      - NODE_ENV=production
      - AGENT_TYPE=backend
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      - nats
      - redis
      - factory-core
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: ["node", "dist/simple-domain-agent.js"]

  # Frontend Domain Agent
  frontend-agent:
    build:
      context: ./containers/domain-agents
      dockerfile: Dockerfile
    container_name: full-frontend-agent
    environment:
      - NODE_ENV=production
      - AGENT_TYPE=frontend
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      - nats
      - redis
      - factory-core
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: ["node", "dist/simple-domain-agent.js"]

  # DevOps Domain Agent
  devops-agent:
    build:
      context: ./containers/domain-agents
      dockerfile: Dockerfile
    container_name: full-devops-agent
    environment:
      - NODE_ENV=production
      - AGENT_TYPE=devops
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      - nats
      - redis
      - factory-core
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: ["node", "dist/simple-domain-agent.js"]

  # QA Domain Agent
  qa-agent:
    build:
      context: ./containers/domain-agents
      dockerfile: Dockerfile
    container_name: full-qa-agent
    environment:
      - NODE_ENV=production
      - AGENT_TYPE=qa
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      - nats
      - redis
      - factory-core
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: ["node", "dist/simple-domain-agent.js"]

  # Documentation Domain Agent
  documentation-agent:
    build:
      context: ./containers/domain-agents
      dockerfile: Dockerfile
    container_name: full-documentation-agent
    environment:
      - NODE_ENV=production
      - AGENT_TYPE=documentation
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
    depends_on:
      - nats
      - redis
      - factory-core
    networks:
      - meta-agent-factory
    restart: unless-stopped
    command: ["node", "dist/simple-domain-agent.js"]

  # Web UI
  web-ui:
    image: nginx:alpine
    container_name: full-web-ui
    ports:
      - "8080:80"
    volumes:
      - ./test-browser.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - factory-core
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: full-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - meta-agent-factory
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: full-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    networks:
      - meta-agent-factory
    restart: unless-stopped