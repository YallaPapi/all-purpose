# HAProxy Configuration for UEP Message Broker - NATS JetStream Load Balancing
#
# This configuration provides high-availability load balancing for the NATS
# JetStream cluster with health checking and observability features.

global
    daemon
    maxconn 4096
    log stdout local0
    stats socket /var/lib/haproxy/stats level admin
    
    # Security settings
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    
    # SSL/TLS Configuration (if needed)
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    retries 3
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout check 5000ms
    
    # Error handling
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Statistics and monitoring interface
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE
    stats show-legends
    stats show-desc UEP Message Broker Load Balancer
    
    # Custom stats page styling
    stats html-exfile /etc/haproxy/stats.html

# NATS Client Connection Load Balancer
frontend nats_client_frontend
    bind *:4222
    mode tcp
    option tcplog
    
    # Connection rate limiting
    stick-table type ip size 100k expire 30s store conn_rate(3s),http_req_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_rate(0) gt 50 }
    
    # Default backend for client connections
    default_backend nats_cluster

# NATS Cluster Backend with Health Checking
backend nats_cluster
    mode tcp
    balance roundrobin
    option tcp-check
    
    # Health check configuration
    tcp-check connect
    tcp-check send-binary "434f4e4e45435420"  # "CONNECT " in hex
    tcp-check send "verbose:false,pedantic:false,tls_required:false\r\n"
    tcp-check expect binary "2b4f4b"  # "+OK" in hex
    
    # Load balancing options
    option log-health-checks
    option redispatch
    
    # Server configuration with health checks
    server nats-1 nats-1:4222 check inter 5s rise 2 fall 3 weight 100
    server nats-2 nats-2:4222 check inter 5s rise 2 fall 3 weight 100  
    server nats-3 nats-3:4222 check inter 5s rise 2 fall 3 weight 100
    
    # Backup server configuration (optional)
    # server nats-backup nats-backup:4222 check inter 10s rise 2 fall 5 backup

# NATS HTTP Monitoring Load Balancer
frontend nats_monitoring_frontend
    bind *:8222
    mode http
    option httplog
    
    # Route monitoring requests to active NATS nodes
    default_backend nats_monitoring

backend nats_monitoring
    mode http
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    
    # Monitoring endpoints
    server nats-1-monitor nats-1:8222 check inter 10s
    server nats-2-monitor nats-2:8222 check inter 10s
    server nats-3-monitor nats-3:8222 check inter 10s

# JetStream Management API Load Balancer (if needed)
frontend jetstream_mgmt_frontend
    bind *:8080
    mode http
    option httplog
    
    # Basic authentication for management API (configure as needed)
    # http-request auth realm "JetStream Management" if !{ http_auth(jetstream-users) }
    
    default_backend jetstream_mgmt

backend jetstream_mgmt
    mode http
    balance roundrobin
    option httpchk GET /jsz
    http-check expect status 200
    
    # Management API endpoints
    server nats-1-mgmt nats-1:8222 check inter 15s
    server nats-2-mgmt nats-2:8222 check inter 15s
    server nats-3-mgmt nats-3:8222 check inter 15s

# Error pages and custom responses
frontend error_pages
    bind *:9999
    mode http
    
    # Custom error responses for debugging
    http-request return status 503 content-type "application/json" string '{"error":"NATS cluster unavailable","timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' if { nb_srv(nats_cluster) eq 0 }

# Logging configuration
frontend logging
    bind *:514 transparent
    mode tcp
    
    # Forward logs to centralized logging system
    default_backend logging_backend

backend logging_backend
    mode tcp
    server syslog syslog:514 check

# SSL/TLS Termination (if certificates are provided)
# frontend nats_ssl_frontend
#     bind *:4443 ssl crt /etc/ssl/certs/nats.pem
