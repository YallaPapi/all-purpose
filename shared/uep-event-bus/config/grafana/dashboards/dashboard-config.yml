# Grafana Dashboard Provisioning Configuration
# 
# This configuration automatically provisions dashboards for the UEP Message Broker
# monitoring system, ensuring consistent dashboard deployment across environments.

apiVersion: 1

providers:
  # NATS JetStream Cluster Dashboards
  - name: 'uep-nats-dashboards'
    orgId: 1
    folder: 'UEP Message Broker'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards

  # UEP Application Dashboards
  - name: 'uep-application-dashboards'
    orgId: 1
    folder: 'UEP Applications'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/applications

  # Infrastructure Dashboards
  - name: 'infrastructure-dashboards'
    orgId: 1
    folder: 'Infrastructure'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/infrastructure

  # Alert Dashboards
  - name: 'alert-dashboards'
    orgId: 1
    folder: 'Alerts & SLA'
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards/alerts

# Folder structure for organizing dashboards
folders:
  - name: 'UEP Message Broker'
    title: 'UEP Message Broker'
    orgId: 1
    uid: 'uep-message-broker'

  - name: 'UEP Applications'
    title: 'UEP Applications'
    orgId: 1
    uid: 'uep-applications'

  - name: 'Infrastructure'
    title: 'Infrastructure'
    orgId: 1
    uid: 'infrastructure'

  - name: 'Alerts & SLA'
    title: 'Alerts & SLA'
    orgId: 1
    uid: 'alerts-sla'

# Dashboard metadata and tagging
dashboard_metadata:
  default_tags:
    - 'uep'
    - 'message-broker'
    - 'production'
    
  default_annotations:
    - name: 'Deployments'
      datasource: 'Prometheus-NATS'
      enable: true
      iconColor: 'rgba(0, 211, 255, 1)'
      
    - name: 'Incidents'
      datasource: 'Prometheus-NATS'
      enable: true
      iconColor: 'rgba(255, 96, 96, 1)'

# Templating defaults for all dashboards
default_templating:
  refresh_intervals: ['5s', '10s', '30s', '1m', '5m', '15m', '30m', '1h', '2h', '1d']
  time_options: ['5m', '15m', '1h', '6h', '12h', '24h', '2d', '7d', '30d']
  timezone: 'browser'
  
# Default dashboard settings
defaults:
  editable: true
  hideControls: false
  graphTooltip: 1
  style: 'dark'
  refresh: '30s'
  
# Theme and appearance settings
appearance:
  theme: 'dark'
  panel_background: 'rgba(128, 128, 128, 0.1)'
  grid_color: 'rgba(128, 128, 128, 0.1)'
  
# Dashboard permissions
permissions:
  - orgId: 1
    teamId: 1
    permission: 'Admin'
    
  - orgId: 1
    teamId: 2
    permission: 'Edit'
    
  - orgId: 1
    userId: 1
    permission: 'Admin'