      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: uep-service-vpa
  namespace: meta-agent-factory
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: uep-service
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: uep-service
      minAllowed:
        cpu: 100m
        memory: 256Mi
      maxAllowed:
        cpu: 1
        memory: 1Gi
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpa-config
  namespace: kube-system
data:
  vpa-config.yaml: |
    # VPA Configuration
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    scaleUpCooldown: 3m
    scaleDownCooldown: 5m
    scaleUpStabilization: 60s
    scaleDownStabilization: 300s