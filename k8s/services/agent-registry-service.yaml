---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-registry-service
  namespace: agent-services
  labels:
    app: agent-registry-service
    version: v1
    component: registry
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-registry-service
      version: v1
  template:
    metadata:
      labels:
        app: agent-registry-service
        version: v1
        component: registry
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "3010"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-registry-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 2000
      containers:
      - name: agent-registry-service
        image: meta-agent-factory/agent-registry-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3010
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3010"
        - name: DB_HOST
          value: "postgres-registry"
        - name: DB_NAME
          value: "agent_registry"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-registry-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-registry-secret
              key: password
        - name: REDIS_HOST
          value: "redis-registry"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-registry-secret
              key: password
        - name: CONSUL_HOST
          value: "consul"
        - name: SERVICE_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3010
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: app-data
          mountPath: /app/data
        - name: app-logs
          mountPath: /app/logs
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: agent-registry-data-pvc
      - name: app-logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: agent-registry-service
  namespace: agent-services
  labels:
    app: agent-registry-service
    service: agent-registry-service
spec:
  type: ClusterIP
  ports:
  - port: 3010
    targetPort: 3010
    protocol: TCP
    name: http
  selector:
    app: agent-registry-service

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-registry-service
  namespace: agent-services
  labels:
    app: agent-registry-service
    account: agent-registry-service

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-registry-data-pvc
  namespace: agent-services
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-registry-secret
  namespace: agent-services
type: Opaque
data:
  username: cmVnaXN0cnlfdXNlcg==  # registry_user
  password: cmVnaXN0cnlfcGFzc3dvcmQ=  # registry_password

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-registry-secret
  namespace: agent-services
type: Opaque
data:
  password: cmVkaXNfcGFzc3dvcmQ=  # redis_password

---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: agent-registry-service
  namespace: agent-services
spec:
  selector:
    matchLabels:
      app: agent-registry-service
  mtls:
    mode: STRICT

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: agent-registry-service
  namespace: agent-services
spec:
  host: agent-registry-service.agent-services.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 10
    circuitBreaker:
      consecutiveErrors: 3
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: LEAST_CONN
  portLevelSettings:
  - port:
      number: 3010
    connectionPool:
      tcp:
        maxConnections: 50

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: agent-registry-service
  namespace: agent-services
spec:
  hosts:
  - agent-registry-service.agent-services.svc.cluster.local
  - registry.localhost
  http:
  - match:
    - uri:
        prefix: /api/agents
  - match:
    - uri:
        prefix: /api/discovery
  - match:
    - uri:
        prefix: /api/registry
    route:
    - destination:
        host: agent-registry-service.agent-services.svc.cluster.local
        port:
          number: 3010
    fault:
      delay:
        percentage:
          value: 0.1
        fixedDelay: 5s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: gateway-error,connect-failure,refused-stream
    timeout: 30s

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-registry-service-hpa
  namespace: agent-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent-registry-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 60

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-registry-config
  namespace: agent-services
data:
  config.json: |
    {
      "server": {
        "port": 3010,
        "host": "0.0.0.0"
      },
      "database": {
        "pool": {
          "min": 2,
          "max": 10,
          "idleTimeoutMillis": 30000
        },
        "ssl": false
      },
      "redis": {
        "keyPrefix": "registry:",
        "connectTimeout": 5000,
        "lazyConnect": true
      },
      "consul": {
        "timeout": 5000,
        "retry": {
          "retries": 3,
          "factor": 2,
          "minTimeout": 1000,
          "maxTimeout": 5000
        }
      },
      "heartbeat": {
        "intervalMs": 60000,
        "timeoutMs": 300000
      },
      "cleanup": {
        "intervalMs": 3600000,
        "retentionHours": 24
      }
    }