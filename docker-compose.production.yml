version: '3.8'

services:
  # NATS with JetStream
  nats-broker:
    image: nats:2.10-alpine
    container_name: meta-agent-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["nats-server", "-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - meta-agent-network

  # Real Factory Core
  factory-core:
    image: meta-agent-factory-core:real
    container_name: meta-agent-factory-core
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - NATS_URL=nats://nats-broker:4222
      - ENABLE_REAL_AGENTS=true
    depends_on:
      nats-broker:
        condition: service_healthy
    networks:
      - meta-agent-network

  # Real UEP Service
  uep-service:
    image: meta-agent-uep-service:real
    container_name: meta-agent-uep-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - NATS_URL=nats://nats-broker:4222
      - UEP_MODE=coordination
    depends_on:
      nats-broker:
        condition: service_healthy
    networks:
      - meta-agent-network

  # Real Agents
  agents:
    image: meta-agent-agents:real
    container_name: meta-agent-agents
    environment:
      - NATS_URL=nats://nats-broker:4222
    depends_on:
      nats-broker:
        condition: service_healthy
      factory-core:
        condition: service_started
    networks:
      - meta-agent-network

  # Redis for state
  redis:
    image: redis:7-alpine
    container_name: meta-agent-redis
    ports:
      - "6379:6379"
    networks:
      - meta-agent-network

networks:
  meta-agent-network:
    driver: bridge
