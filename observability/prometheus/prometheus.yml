global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'meta-agent-factory'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  - "alert_rules.yml"
  - "recording_rules.yml"

# Scrape configuration
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scrape_interval: 30s

  # Meta-Agent Factory Services
  - job_name: 'meta-agent-factory'
    static_configs:
      - targets:
        - 'api-gateway:8080'
        - 'agent-registry-service:3010'
        - 'agent-coordination-service:3011'
        - 'backend-agent-service:3020'
        - 'frontend-agent-service:3021'
        - 'devops-agent-service:3022'
        - 'qa-agent-service:3023'
        - 'documentation-agent-service:3024'
        - 'prd-parser-service:3030'
        - 'template-engine-service:3031'
        - 'agent-memory-service:3040'
        - 'uep-service:3003'
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # Infrastructure Services
  - job_name: 'infrastructure'
    static_configs:
      - targets:
        - 'consul:8500'
        - 'nats-broker:8222'
        - 'jaeger:14269'
    metrics_path: /metrics
    scrape_interval: 30s

  # Database Services
  - job_name: 'databases'
    static_configs:
      - targets:
        - 'postgres-registry:5432'
        - 'postgres-coordination:5432'
        - 'postgres-backend:5432'
        - 'postgres-frontend:5432'
        - 'postgres-devops:5432'
        - 'postgres-qa:5432'
        - 'postgres-documentation:5432'
        - 'postgres-memory:5432'
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis Services
  - job_name: 'redis'
    static_configs:
      - targets:
        - 'redis-registry:6379'
        - 'redis-coordination:6379'
        - 'redis-memory:6379'
    metrics_path: /metrics
    scrape_interval: 30s

  # MongoDB Services
  - job_name: 'mongodb'
    static_configs:
      - targets:
        - 'mongo-templates:27017'
    metrics_path: /metrics
    scrape_interval: 30s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets:
        - 'node-exporter:9100'
    metrics_path: /metrics
    scrape_interval: 15s

  # cAdvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets:
        - 'cadvisor:8080'
    metrics_path: /metrics
    scrape_interval: 15s

  # Istio Service Mesh Metrics
  - job_name: 'istio-mesh'
    kubernetes_sd_configs:
    - role: endpoints
      namespaces:
        names:
        - istio-system
        - meta-agent-factory
        - agent-services
        - data-services
        - integration-services
    relabel_configs:
    - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
      action: keep
      regex: istio-proxy;http-monitoring
    - source_labels: [__address__, __meta_kubernetes_endpoint_port]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:$2
      target_label: __address__
    - action: labelmap
      regex: __meta_kubernetes_service_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      action: replace
      target_label: namespace
    - source_labels: [__meta_kubernetes_service_name]
      action: replace
      target_label: service_name

  # Kubernetes API Server
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
    - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
    - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
      action: keep
      regex: default;kubernetes;https

  # Kubernetes Nodes
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
    - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
    - action: labelmap
      regex: __meta_kubernetes_node_label_(.+)
    - target_label: __address__
      replacement: kubernetes.default.svc:443
    - source_labels: [__meta_kubernetes_node_name]
      regex: (.+)
      target_label: __metrics_path__
      replacement: /api/v1/nodes/${1}/proxy/metrics

  # Kubernetes Pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
    - role: pod
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      action: keep
      regex: true
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:$2
      target_label: __address__
    - action: labelmap
      regex: __meta_kubernetes_pod_label_(.+)
    - source_labels: [__meta_kubernetes_namespace]
      action: replace
      target_label: namespace
    - source_labels: [__meta_kubernetes_pod_name]
      action: replace
      target_label: pod

  # UEP Service Metrics (Custom)
  - job_name: 'uep-metrics'
    static_configs:
      - targets: ['uep-service:3003']
    metrics_path: /api/metrics
    scrape_interval: 10s
    params:
      format: ['prometheus']

  # Agent Lifecycle Metrics
  - job_name: 'agent-lifecycle'
    static_configs:
      - targets: ['agent-registry-service:3010']
    metrics_path: /api/registry/metrics
    scrape_interval: 15s

  # Business Metrics (Custom)
  - job_name: 'business-metrics'
    static_configs:
      - targets:
        - 'backend-agent-service:3020'
        - 'frontend-agent-service:3021'
        - 'devops-agent-service:3022'
        - 'qa-agent-service:3023'
        - 'documentation-agent-service:3024'
    metrics_path: /api/metrics/business
    scrape_interval: 30s

# Storage configuration
storage:
  tsdb:
    path: /prometheus
    retention.time: 30d
    retention.size: 50GB
    wal-compression: true

# Remote write configuration (for long-term storage)
remote_write:
  - url: "http://thanos-receive:19291/api/v1/receive"
    queue_config:
      max_samples_per_send: 10000
      batch_send_deadline: 5s
      max_shards: 200
      min_shards: 1
      max_retries: 10
      min_backoff: 30ms
      max_backoff: 100ms

# Feature flags
feature_flags:
  - agent
  - exemplar-storage
  - expand-external-labels
  - memory-snapshot-on-shutdown
  - promql-at-modifier
  - promql-negative-offset