# NATS Server Configuration for Testing
server_name: nats-test-server
port: 4222
http_port: 8222

# Simple authentication
authorization {
  users = [
    {user: "factory", password: "factory-secret"}
  ]
}

# JetStream Configuration
jetstream {
  store_dir: "./nats-data"
  max_memory_store: 256MB
  max_file_store: 2GB
}

# Logging
logtime: true
debug: false
trace: false
log_file: "./nats-test.log"

# Limits
max_connections: 64K
max_control_line: 4KB
max_payload: 1MB
max_pending: 64MB
max_subscriptions: 0

# Monitoring
monitor_port: 8222